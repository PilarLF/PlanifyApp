<div class="admin-dashboard">

  <h1>Panel de Administración</h1>

  <!-- ============================
       CALENDARIO
  ============================ -->
  <div class="calendar-container">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

  <hr>

  <!-- ============================
       FORMULARIO CREAR TURNOS
  ============================ -->
  <h2>Crear turno</h2>

  <form (ngSubmit)="crearHorario()">
    <label>Empleado</label>
    <select [(ngModel)]="form.employee_id" name="employee_id" required>
      <option *ngFor="let e of empleados" [value]="e.id">
        {{ e.name }}
      </option>
    </select>

    <label>Inicio</label>
    <input type="datetime-local" [(ngModel)]="form.start_time" name="start_time" required>

    <label>Fin</label>
    <input type="datetime-local" [(ngModel)]="form.end_time" name="end_time" required>

    <button type="submit">Crear turno</button>
  </form>

  <p class="success" *ngIf="mensaje">{{ mensaje }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <hr>

  <!-- ============================
       LISTA DE TURNOS
  ============================ -->
  <h2>Turnos existentes</h2>

  <table>
    <tr>
      <th>Empleado</th>
      <th>Inicio</th>
      <th>Fin</th>
      <th>Acciones</th>
    </tr>

    <tr *ngFor="let h of horarios">
      <td>{{ h.employee_name }}</td>
      <td>{{ h.start_time | date:'short' }}</td>
      <td>{{ h.end_time | date:'short' }}</td>
      <td>
        <button (click)="editar(h)">Editar</button>
        <button (click)="borrar(h.id)">Eliminar</button>
      </td>
    </tr>
  </table>

  <!-- ============================
       FORMULARIO EDITAR
  ============================ -->
  <div *ngIf="editando" class="edit-box">
    <h3>Editar turno</h3>

    <label>Inicio</label>
    <input type="datetime-local" [(ngModel)]="editando.start_time">

    <label>Fin</label>
    <input type="datetime-local" [(ngModel)]="editando.end_time">

    <button (click)="guardarEdicion()">Guardar</button>
    <button (click)="editando = null">Cancelar</button>
  </div>

</div>
