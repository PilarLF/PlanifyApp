<div class="login-container">
  <div class="login-header">
    <img src="assets/img/logo2.png" alt="Planify Logo" class="login-logo">
    <h1>Bienvenido a PlanifyApp</h1>
    <h2>Inicia sesión para gestionar tus turnos y horarios</h2>
  </div>
  <div class="auth-card">
    <h3>Iniciar sesión</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <label>Email</label>
      <input type="email" formControlName="email">

      <label>Contraseña</label>
      <input type="password" formControlName="password">

      <button class="register-btn" type="submit" [disabled]="loginForm.invalid">Entrar</button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="register-link">
      ¿No tienes cuenta? Contacta con tu administrador.
    </p>

  </div>
</div>
